name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build with Astro
        uses: withastro/action@v3
        with:
          node-version: "22"
        env:
          # Not secret - inlined into the client bundle either way (Astro PUBLIC_ vars are
          # public by design). CORS on the ask-my-site backend is what actually restricts
          # who can call it. .env is gitignored and never reaches this checkout, so this is
          # the only place CI learns the value.
          PUBLIC_ASK_MY_SITE_API_URL: https://ask-my-site-3qwezbjyfq-ew.a.run.app

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
